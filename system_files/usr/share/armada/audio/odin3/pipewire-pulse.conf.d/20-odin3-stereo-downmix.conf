# Preserve every multichannel input when a PulseAudio-compatible application
# targets the two-channel Stereo sink. LFE mixing is enabled because the Odin 3
# has no separate subwoofer channel.

stream.properties = {
    channelmix.mix-lfe = true
    channelmix.center-level = 0.707106781
    channelmix.surround-level = 0.707106781
    channelmix.lfe-level = 0.5
}
