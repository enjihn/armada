# AYN Odin 3 two-channel speaker profile.
#
# Multichannel PulseAudio-compatible streams are downmixed before entering this
# graph. Only the profile's front-left and front-right impulse-response paths
# are used, so center, LFE, and surround content becomes ordinary stereo.

context.modules = [
    {
        name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Stereo"
            node.nick = "Stereo"
            device.description = "Stereo"
            media.name = "Stereo"

            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = copyFL }
                    { type = builtin label = copy name = copyFR }

                    { type = builtin label = convolver name = convFL_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/var/home/armada/.local/share/armada/odin3-audio/hrir.wav" channel = 0 } }
                    { type = builtin label = convolver name = convFL_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/var/home/armada/.local/share/armada/odin3-audio/hrir.wav" channel = 1 } }
                    { type = builtin label = convolver name = convFR_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/var/home/armada/.local/share/armada/odin3-audio/hrir.wav" channel = 8 } }
                    { type = builtin label = convolver name = convFR_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/var/home/armada/.local/share/armada/odin3-audio/hrir.wav" channel = 7 } }

                    {
                        type = builtin
                        label = mixer
                        name = mixL
                        control = {
                            "Gain 1" = 0.295248
                            "Gain 2" = 0.295248
                        }
                    }
                    {
                        type = builtin
                        label = mixer
                        name = mixR
                        control = {
                            "Gain 1" = 0.295248
                            "Gain 2" = 0.295248
                        }
                    }

                    { type = builtin label = clamp name = clampL control = { "Min" = -0.8912509381 "Max" = 0.8912509381 } }
                    { type = builtin label = clamp name = clampR control = { "Min" = -0.8912509381 "Max" = 0.8912509381 } }
                ]

                links = [
                    { output = "copyFL:Out" input = "convFL_L:In" }
                    { output = "copyFL:Out" input = "convFL_R:In" }
                    { output = "copyFR:Out" input = "convFR_L:In" }
                    { output = "copyFR:Out" input = "convFR_R:In" }

                    { output = "convFL_L:Out" input = "mixL:In 1" }
                    { output = "convFR_L:Out" input = "mixL:In 2" }
                    { output = "convFL_R:Out" input = "mixR:In 1" }
                    { output = "convFR_R:Out" input = "mixR:In 2" }

                    { output = "mixL:Out" input = "clampL:In" }
                    { output = "mixR:Out" input = "clampR:In" }
                ]

                inputs = [ "copyFL:In" "copyFR:In" ]
                outputs = [ "clampL:Out" "clampR:Out" ]
            }

            capture.props = {
                node.name = "Stereo"
                node.description = "Stereo"
                node.nick = "Stereo"
                device.description = "Stereo"
                media.name = "Stereo"
                media.class = Audio/Sink
                node.virtual = true
                priority.session = 2500
                audio.rate = 48000
                audio.channels = 2
                audio.position = [ FL FR ]
                stream.dont-remix = false
                channelmix.mix-lfe = true
                channelmix.normalize = false
            }

            playback.props = {
                node.name = "effect_output.odin3_stereo"
                media.class = "Stream/Output/Audio/Internal"
                target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
                node.autoconnect = true
                node.passive = true
                node.dont-fallback = true
                node.linger = true
                node.dont-move = true
                state.restore-props = false
                audio.rate = 48000
                audio.channels = 2
                audio.position = [ FL FR ]
                stream.dont-remix = true
            }
        }
    }
]
